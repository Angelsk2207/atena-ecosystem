  <rect x="30" y="220" width="1140" height="280" rx="8" fill="#FFF8F0" stroke="#FF9900" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="243" font-size="14" font-weight="bold" fill="#FF9900">🧠 ZAPIA — Cérebro Central (Orquestrador)</text>
  <text x="50" y="263" font-size="11" fill="#646464">Interpreta comandos, escolhe a skill certa, gerencia agentes e executa automações programadas.</text>

  <!-- Zapia Core -->
  <rect x="80" y="275" width="220" height="60" rx="10" fill="#232F3E" stroke="#FF9900" stroke-width="2"/>
  <text x="190" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">🧠 Zapia AI</text>
  <text x="190" y="320" text-anchor="middle" font-size="11" fill="#FFD700">Cérebro do ecossistema</text>

  <!-- Skills -->
  <rect x="380" y="275" width="170" height="55" rx="8" fill="#FCE7F3" stroke="#F472B6" stroke-width="1.5"/>
