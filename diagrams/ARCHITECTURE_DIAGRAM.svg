  <line x1="410" y1="500" x2="410" y2="575" stroke="#646464" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="500" x2="640" y2="575" stroke="#646464" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="500" x2="870" y2="575" stroke="#646464" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1070" y1="500" x2="1070" y2="575" stroke="#646464" stroke-width="1.5" marker-end="url(#arrow)"/>

