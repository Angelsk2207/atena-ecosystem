  <text x="180" y="615" text-anchor="middle" font-size="10" fill="#DC2626">n8n + FreeLLMAPI</text>
  <text x="180" y="630" text-anchor="middle" font-size="10" fill="#DC2626">+ Dashboard Atena</text>

