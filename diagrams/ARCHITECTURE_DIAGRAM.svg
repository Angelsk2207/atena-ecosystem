  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#141414">🌌 ATENA ECOSYSTEM — Arquitetura Geral</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#646464">Sistema de Agentes e Automação Inteligente | Peso Zero na Nuvem</text>

  <!-- ==================== SECTION 1: CELULAR ==================== -->
  <rect x="30" y="85" width="1140" height="120" rx="8" fill="#F8F9FA" stroke="#232F3E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="108" font-size="14" font-weight="bold" fill="#232F3E">📱 CELULAR — Tela Burra (POCO C65)</text>
  <text x="50" y="128" font-size="11" fill="#646464">Só transmite. O celular mantém o terminal rodando, não processa nada pesado.</text>

  <!-- User -->
  <rect x="80" y="140" width="180" height="50" rx="25" fill="#E8F0FE" stroke="#232F3E" stroke-width="1.5"/>
  <text x="170" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#141414">👤 Jessica Gaya</text>

  <!-- Arrow -->
  <line x1="260" y1="165" x2="320" y2="165" stroke="#646464" stroke-width="2" marker-end="url(#arrow)"/>

