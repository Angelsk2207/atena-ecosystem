  <text x="410" y="615" text-anchor="middle" font-size="10" fill="#1E40AF">Workers AI + R2 Storage</text>
  <text x="410" y="630" text-anchor="middle" font-size="10" fill="#1E40AF">FLUX, SDXL, Dreamshaper</text>

