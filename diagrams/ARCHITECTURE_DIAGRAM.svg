  <text x="50" y="753" font-size="14" font-weight="bold" fill="#FF9900">📊 CLIENTES — Conteúdo Produzido</text>
  <text x="50" y="773" font-size="11" fill="#646464">Roteiros gerados pelo Zapia, entregues via WhatsApp e postados nas redes.</text>

  <rect x="80" y="785" width="300" height="35" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="230" y="808" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">👩‍⚖️ Dra. Luísa — Direito Criminal</text>

  <rect x="420" y="785" width="300" height="35" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="570" y="808" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">👨‍⚖️ Dr. Luciano — Direito Civil</text>

  <rect x="760" y="785" width="300" height="35" rx="8" fill="#FCE7F3" stroke="#F472B6" stroke-width="1.5"/>
  <text x="910" y="808" text-anchor="middle" font-size="12" font-weight="bold" fill="#BE185D">🎯 Angel Sakura — Design + Tech</text>

  <!-- Arrows from cloud to clients -->
  <line x1="230" y1="715" x2="230" y2="785" stroke="#646464" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="715" x2="570" y2="785" stroke="#646464" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="910" y1="715" x2="910" y2="785" stroke="#646464" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="1050" y="863" text-anchor="end" font-size="10" fill="#646464">📅 Gerado em 2026-07-24 | Atena Ecosystem v1.0</text>
