  <rect x="330" y="385" width="220" height="45" rx="8" fill="#EDE9FE" stroke="#A066F0" stroke-width="1.5"/>
  <text x="440" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#5B21B6">🛡️ CYBERGUARD</text>
